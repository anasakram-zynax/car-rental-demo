<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { padding: 40px; width: fit-content; }

  /* ── Logo lockup: badge + wordmark ─────────────────────────────── */
  .logo { display: inline-flex; align-items: center; gap: 26px; }

  .badge {
    position: relative; width: 128px; height: 128px; border-radius: 34px;
    background: linear-gradient(135deg, #0a5b6d 0%, #033d4a 55%, #01252e 100%);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.28), inset 0 2px 6px rgba(255,255,255,.18), 0 14px 30px rgba(3,61,74,.28);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .badge::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(120% 85% at 16% 0%, rgba(255,255,255,.34), transparent 55%);
  }
  .badge svg { position: relative; width: 84px; height: 84px; }

  .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .wordmark .name { font-size: 76px; font-weight: 800; letter-spacing: -2.5px; color: #18181b; }
  .wordmark .name .ota { color: #033d4a; }
  .wordmark .tag { margin-top: 10px; font-size: 21px; font-weight: 700; letter-spacing: 6.5px; color: #336670; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="stage" id="logo-stage">
    <div class="logo">
      <div class="badge">
        <!-- Globe + ascending plane mark -->
        <svg viewBox="0 0 96 96" fill="none">
          <defs>
            <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity=".9"/>
            </linearGradient>
          </defs>
          <!-- globe: circle + meridians -->
          <circle cx="44" cy="52" r="30" stroke="#ffffff" stroke-width="4.5"/>
          <ellipse cx="44" cy="52" rx="13.5" ry="30" stroke="#ffffff" stroke-width="3" opacity=".75"/>
          <path d="M15.5 44.5 H72.5" stroke="#ffffff" stroke-width="3" opacity=".75"/>
          <path d="M17.5 61.5 H70.5" stroke="#ffffff" stroke-width="2.5" opacity=".5"/>
          <!-- ascending plane (filled silhouette) -->
          <path d="M78.5 14.5 74 33.5l9.5 9.5c1.4 1.4 1.4 3.4 0 4.4-1 1-3 1-4.4-.4L69.5 37.5l-19 4.5L46 37l14-6.5 3.5-15L68 11l1.5 12 7-4.5z"
                fill="#ffffff" transform="rotate(-8 60 30)"/>
          <!-- motion trail -->
          <path d="M14 30 C 28 22, 44 18, 60 17.5" stroke="url(#trail)" stroke-width="3" stroke-linecap="round" opacity=".85"/>
        </svg>
      </div>
      <div class="wordmark">
        <div class="name">Travels<span class="ota">OTA</span></div>
        <div class="tag">Beyond&nbsp;Limits</div>
      </div>
    </div>
  </div>
</body>
</html>
