<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  .stage { width: fit-content; }
  .mark {
    position: relative; width: 512px; height: 512px; border-radius: 118px;
    background: linear-gradient(135deg, #0a5b6d 0%, #033d4a 55%, #01252e 100%);
    box-shadow: inset 0 0 0 5px rgba(255,255,255,.28), inset 0 6px 18px rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .mark::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(120% 85% at 16% 0%, rgba(255,255,255,.32), transparent 55%);
  }
  .mark svg { position: relative; width: 340px; height: 340px; }
</style>
</head>
<body>
  <div class="stage" id="favicon-stage">
    <div class="mark">
      <svg viewBox="0 0 96 96" fill="none">
        <defs>
          <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity=".9"/>
          </linearGradient>
        </defs>
        <circle cx="44" cy="52" r="30" stroke="#ffffff" stroke-width="4.5"/>
        <ellipse cx="44" cy="52" rx="13.5" ry="30" stroke="#ffffff" stroke-width="3" opacity=".75"/>
        <path d="M15.5 44.5 H72.5" stroke="#ffffff" stroke-width="3" opacity=".75"/>
        <path d="M17.5 61.5 H70.5" stroke="#ffffff" stroke-width="2.5" opacity=".5"/>
        <path d="M78.5 14.5 74 33.5l9.5 9.5c1.4 1.4 1.4 3.4 0 4.4-1 1-3 1-4.4-.4L69.5 37.5l-19 4.5L46 37l14-6.5 3.5-15L68 11l1.5 12 7-4.5z"
              fill="#ffffff" transform="rotate(-8 60 30)"/>
        <path d="M14 30 C 28 22, 44 18, 60 17.5" stroke="url(#trail)" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      </svg>
    </div>
  </div>
</body>
</html>
